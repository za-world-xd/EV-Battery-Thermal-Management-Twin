[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-celltwin"
version = "0.1.0"
description = "Educational electro-thermal cell and liquid cooling simulator"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3", "scipy>=1.14,<2", "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1", "pydantic>=2.10,<3",
    "streamlit>=1.45,<2", "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["simulator*", "app*"]

[tool.setuptools.package-data]
simulator = ["cycles/*.txt"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
